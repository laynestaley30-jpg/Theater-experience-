<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Theater Experience</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Limelight&display=swap">
<style>
:root{--bg:#07060a;--ink:#f1e6d0;--ink-dim:#b9ad96;--brass:#cf9f4e;--panel:rgba(16,13,18,.78);--line:rgba(207,159,78,.38);
--font-display:'Limelight',Georgia,serif;--font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
html{box-sizing:border-box;height:100%;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-user-select:none;user-select:none}
#stage{position:absolute;top:0;left:0;right:0;bottom:0;touch-action:none;cursor:grab;background:var(--bg);outline:none}
#stage canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#yt{position:absolute;display:none;border:0;background:#000;pointer-events:none;z-index:2}
.ui{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;grid-template-rows:auto 1fr auto;gap:12px;z-index:3;
padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.brand{justify-self:start;max-width:100%;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:4px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(1.15rem,4.6vw,1.65rem);line-height:1.1}
.brand p{margin:6px 0 0;font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.bottom{grid-row:3;display:flex;flex-direction:column;align-items:center;gap:10px}
.hint{margin:0;font-size:.8rem;color:var(--ink-dim);text-shadow:0 1px 6px #000;text-align:center}
.views{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:4px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:auto;max-width:100%}
.views button{font:500 .88rem/1 var(--font-body);color:var(--ink-dim);background:transparent;border:0;border-radius:2px;padding:0 16px;min-height:42px;cursor:pointer;letter-spacing:.04em;-webkit-appearance:none;appearance:none}
.views button:hover{color:var(--ink)}
.views button[aria-pressed="true"]{background:var(--brass);color:#1a1208;font-weight:700}
.views button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.stick{position:absolute;z-index:4;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 112px);width:116px;height:116px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;touch-action:none}
.stick[hidden]{display:none}
.pausebtn{position:absolute;z-index:4;right:max(16px,env(safe-area-inset-right,0px));top:max(16px,env(safe-area-inset-top,0px));font:700 .9rem/1 var(--font-body);color:#1a1208;background:var(--brass);border:0;border-radius:4px;padding:0 18px;min-height:44px;cursor:pointer;-webkit-appearance:none;appearance:none}
.pausebtn[hidden]{display:none}
.knob{width:46px;height:46px;border-radius:50%;background:var(--brass);box-shadow:0 2px 10px rgba(0,0,0,.5);pointer-events:none}
.prompt{position:absolute;z-index:4;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 128px);font:700 .9rem/1 var(--font-body);color:#1a1208;background:var(--brass);border:0;border-radius:4px;padding:13px 18px;cursor:pointer}
.panel select{width:100%;margin-top:8px;font:16px var(--font-body);padding:11px;border-radius:4px;border:1px solid var(--line);background:#0b090d;color:var(--ink)}
.panel .tkrow{display:flex;gap:8px}
.prompt[hidden],.panel[hidden]{display:none}
.panel{position:absolute;z-index:5;left:50%;top:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));padding:20px;background:rgba(16,13,18,.96);border:1px solid var(--line);border-radius:6px}
.panel h2{margin:0 0 12px;font:400 1.4rem var(--font-display)}
.panel input{width:100%;font:16px var(--font-body);padding:12px;border-radius:4px;border:1px solid var(--line);background:#0b090d;color:var(--ink);-webkit-user-select:text;user-select:text}
.panel .row{display:flex;gap:8px;margin-top:12px}
.panel button{font:700 .9rem var(--font-body);min-height:42px;padding:0 18px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.panel button.go{background:var(--brass);color:#1a1208;border-color:var(--brass)}
.err{min-height:1.2em;margin:10px 0 0;font-size:.8rem;color:#ffb3a0}
.fallback{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;margin:0;padding:24px;text-align:center;color:var(--ink-dim);z-index:6}
.fallback[hidden]{display:none}
</style>
</head>
<body>
<main id="stage" tabindex="0" aria-label="3D view of the theater. Use W A S D or the arrow keys to walk."></main>
<iframe id="yt" title="YouTube on the theater screen" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
<div class="ui">
  <header class="brand"><h1>The Theater Experience</h1><p>NCG Theater · Auditorium 1</p></header>
  <div class="bottom">
    <p class="hint">W A S D to walk · Shift to run · drag to look</p>
    <nav class="views" aria-label="Camera views">
      <button type="button" data-v="seats" aria-pressed="true">Seats</button>
      <button type="button" data-v="front" aria-pressed="false">Front row</button>
      <button type="button" data-v="lobby" aria-pressed="false">Lobby</button>
      <button type="button" data-v="back" aria-pressed="false">Back of room</button>
    </nav>
  </div>
</div>
<button class="pausebtn" id="pauseBtn" type="button" hidden>❚❚ Pause</button>
<div class="stick" id="stick" hidden aria-hidden="true"><div class="knob" id="knob"></div></div>
<button class="prompt" id="machinePrompt" type="button" hidden>Use the YouTube machine (E)</button>
<button class="prompt" id="seatPrompt" type="button" hidden style="bottom:calc(env(safe-area-inset-bottom,0px) + 176px)">Sit here (E)</button>
<div class="panel" id="youtubePanel" hidden>
  <h2>YouTube Machine</h2>
  <input id="youtubeUrl" type="text" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="Paste a YouTube link">
  <p class="err" id="youtubeError"></p>
  <div class="row"><button class="go" id="playYoutube" type="button">Play on screen</button><button id="closeYoutube" type="button">Close</button></div>
</div>
<div class="panel" id="ticketPanel" hidden>
  <h2>Ticket Window</h2>
  <select id="tkMovie"></select>
  <div class="tkrow"><select id="tkTime"></select><select id="tkQty" style="width:140px"></select></div>
  <canvas id="tkCanvas" width="520" height="190" style="width:100%;margin-top:12px;border-radius:4px"></canvas>
  <div class="row"><button class="go" id="tkGet" type="button">Print ticket</button><button id="tkSeat" type="button" disabled>Go to my seat</button><button id="tkClose" type="button">Close</button></div>
</div>
<div class="panel" id="videoPanel" hidden>
  <h2>Video Kiosk</h2>
  <input id="videoFile" type="file" accept="video/mp4,video/quicktime,video/*">
  <p style="margin:14px 0 6px;font-size:.8rem;color:var(--ink-dim)">Optional captions file (.srt or .vtt). Videos with built-in captions show them automatically.</p>
  <input id="captionFile" type="file" accept=".srt,.vtt,text/vtt,application/x-subrip">
  <label style="display:block;margin-top:12px;font-size:.85rem;color:var(--ink-dim)"><input id="capOn" type="checkbox" checked style="width:auto;margin-right:8px">Show captions (press C in the theater to toggle)</label>
  <p class="err" id="videoError"></p>
  <div class="row"><button class="go" id="playVideo" type="button">Play on screen</button><button id="stopVideo" type="button">Stop</button><button id="closeVideo" type="button">Close</button></div>
</div>
<p class="fallback" id="fallback" hidden>This browser could not start the 3D view.</p>

<script>
(function () {
  'use strict';
  function fail(m) { var f = document.getElementById('fallback'); f.hidden = false; f.textContent = m; }
  function go() { try { startGame(); } catch (e) { fail('The 3D view hit an error while starting. Refresh the page. ' + (e && e.message ? e.message : '')); } }
  function load(urls, i) {

  load(['https://cdnjs.cloudflare.com/ajax/libs/babylonjs/6.49.0/babylon.js', 'https://cdn.jsdelivr.net/npm/babylonjs@6.49.0/babylon.js'], 0);

  function startGame() {
    var BJ = BABYLON, V3 = BJ.Vector3, $ = function (id) { return document.getElementById(id); };

    try { engine = new BJ.Engine(canvas, true, { stencil: false }, false); }
    catch (e) { fail('Your browser could not create a WebGL graphics view. Try closing other tabs or restarting the browser.'); return; }

    var FLOOR = -4.0, ROWS = 12, ROW_STEP = 1.4, RAKE = 0.34, FRONT_Z = -15, BACK_Z = 12, LX = 30, LZ1 = 64, LH = 12;
    function tierTop(i) { return (i - (ROWS - 1)) * RAKE; }
    function tierZ(i) { return -8 + i * ROW_STEP; }

    function col(h) { return new BJ.Color3(((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255); }

    function lit(t) { var m = new BJ.StandardMaterial('l', scene); m.diffuseColor = BJ.Color3.Black(); m.emissiveTexture = t; m.emissiveTexture.level = 0.85; m.disableLighting = true; return m; }
    function place(m, mat, x, y, z, ry) { m.position.set(x, y, -z); if (ry) m.rotation.y = -ry; m.material = mat; return m; }
    function B(w, h, d, mat, x, y, z, ry) { return place(BJ.MeshBuilder.CreateBox('b', { width: w, height: h, depth: d }, scene), mat, x, y, z, ry); }
    function PL(w, h, mat, x, y, z, ry) { return place(BJ.MeshBuilder.CreatePlane('p', { width: w, height: h }, scene), mat, x, y, z, ry); }
    function CY(rt, rb, h, mat, x, y, z, seg) { return place(BJ.MeshBuilder.CreateCylinder('c', { diameterTop: rt * 2, diameterBottom: rb * 2, height: h, tessellation: seg || 14 }, scene), mat, x, y, z); }

    var seed = 7, nowShowing = '';
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

    /* ---------- textures ---------- */

    function tex(w, h, draw) {
      var t = new BJ.DynamicTexture('t', { width: w, height: h }, scene, true), g = t.getContext();

    function carpet(sz, base, line, lw, dot, n) {
      return tex(sz, sz, function (g, w, h) {
        g.fillStyle = base; g.fillRect(0, 0, w, h); g.strokeStyle = line; g.lineWidth = lw; g.beginPath();

    var carpetA = carpet(128, '#1b2440', '#2c386a', 3, '#8a6a30', 160), carpetB = carpet(256, '#3a1820', '#5a2a34', 6, '#c0923f', 260);
    var screenTex = tex(1280, 720, function (g, w, h) {
      var gr = g.createRadialGradient(w / 2, h * .45, 60, w / 2, h / 2, w * .7);
      gr.addColorStop(0, '#26335a'); gr.addColorStop(1, '#06070c'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
      g.strokeStyle = 'rgba(207,159,78,.6)'; g.lineWidth = 3; g.strokeRect(48, 48, w - 96, h - 96); g.lineWidth = 1; g.strokeRect(62, 62, w - 124, h - 124);
      g.textAlign = 'center'; g.fillStyle = '#f1e6d0'; g.font = '86px Limelight, Georgia, serif';
      g.fillText('THE THEATER', w / 2, h * .45); g.fillText('EXPERIENCE', w / 2, h * .45 + 104);
      g.fillStyle = '#cf9f4e'; g.font = '600 28px "DM Sans", sans-serif'; g.fillText('NCG THEATER  ·  AUDITORIUM 1', w / 2, h * .82);

    });

    function sign(text, fg, bg, w, h, font) {
      return tex(w, h, function (g, W, H) {
        g.fillStyle = bg; g.fillRect(0, 0, W, H); g.strokeStyle = fg; g.lineWidth = 4; g.strokeRect(6, 6, W - 12, H - 12);
        g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = font; g.fillText(text, W / 2, H / 2 + 3);
      });
    }
    var exitTex = sign('EXIT', '#e9fff0', '#0d7a3c', 256, 96, '700 52px "DM Sans", sans-serif');
    var audTex = sign('AUDITORIUM 1', '#f1e6d0', '#1a1116', 640, 128, '48px Limelight, Georgia, serif');
    var ticketSignTex = sign('TICKETS', '#f1e6d0', '#1a1116', 640, 128, '60px Limelight, Georgia, serif');
    var ncgTex = tex(2048, 320, function (g, w, h) {
      g.fillStyle = '#120c10'; g.fillRect(0, 0, w, h); g.strokeStyle = '#cf9f4e'; g.lineWidth = 8; g.strokeRect(14, 14, w - 28, h - 28);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      var gr = g.createLinearGradient(0, 60, 0, 260); gr.addColorStop(0, '#fff0c8'); gr.addColorStop(1, '#cf9f4e');
      g.shadowColor = 'rgba(255,190,90,.75)'; g.shadowBlur = 28; g.fillStyle = gr; g.font = '210px Limelight, Georgia, serif'; g.fillText('NCG THEATER', w / 2, h / 2 + 8);
    });
    function menuTex(title, items) {
      return tex(768, 360, function (g, w, h) {
        g.fillStyle = '#17100c'; g.fillRect(0, 0, w, h); g.strokeStyle = '#cf9f4e'; g.lineWidth = 5; g.strokeRect(10, 10, w - 20, h - 20);
        g.textAlign = 'center'; g.fillStyle = '#ffd68a'; g.font = '56px Limelight, Georgia, serif'; g.fillText(title, w / 2, 86);
        g.fillStyle = '#f1e6d0'; g.font = '500 34px "DM Sans", sans-serif'; items.forEach(function (t, i) { g.fillText(t, w / 2, 160 + i * 52); });

    var menus = [menuTex('POPCORN', ['Small · Medium · Large', 'Butter · Caramel · Cheddar', 'Family Tub']),
      menuTex('DRINKS', ['Fountain Soda', 'Slushie · Iced Tea', 'Bottled Water']), menuTex('CANDY', ['Chocolate Bites', 'Sour Strips · Licorice', 'Jelly Beans'])];
    var posterSets = [['MIDNIGHT HARBOR', '#0f2a4a', '#e8a04a'], ['THE LAST LANTERN', '#3a1230', '#ffcf70'], ['PAPER PLANETS', '#12403c', '#f5e6b8'],
      ['RUN COLD', '#2a2d3a', '#7ec8ff'], ['ECHO VALLEY', '#4a2210', '#ffd9a0'], ['SUNDAY BLOOM', '#1d3a2e', '#bfe8a0']];

      });
    }
    var kioskTex = tex(256, 340, function (g, w, h) {
      g.fillStyle = '#0c2a33'; g.fillRect(0, 0, w, h); g.fillStyle = '#9fe3f0'; g.textAlign = 'center'; g.font = '44px Limelight, Georgia, serif'; g.fillText('TICKETS', w / 2, 70);
      g.fillStyle = 'rgba(159,227,240,.35)'; for (var i = 0; i < 4; i++) g.fillRect(28, 112 + i * 52, w - 56, 34);
    });

    /* ---------- materials and lights ---------- */
    var mWall = M(C.wall), mCeil = M(C.ceil), mDark = M(C.dark), mBrass = M(C.brass, { specularColor: new BJ.Color3(.7, .55, .3), specularPower: 24 }),
      mWood = M(C.wood), mPlum = M(C.plum), mCurA = M(C.wine), mCurB = M(0x42101c),
      mCarA = M(0xffffff, { diffuseTexture: carpetA }), mCarB = M(0xffffff, { diffuseTexture: carpetB }),
      mAmber = G(0xffc27a), mWarm = G(0xffe2b0),
      mGlass = M(0x9fc4d6, { alpha: 0.2, backFaceCulling: false });
    var hemi = new BJ.HemisphericLight('h', new V3(0, 1, 0), scene);
    hemi.intensity = 1.05; hemi.diffuse = new BJ.Color3(.82, .85, 1); hemi.groundColor = new BJ.Color3(.42, .36, .4); hemi.specular = BJ.Color3.Black();
    function plight(x, y, z, c, inten, range) { var l = new BJ.PointLight('p', new V3(x, y, -z), scene); l.diffuse = col(c); l.specular = BJ.Color3.Black(); l.intensity = inten; l.range = range; return l; }
    plight(0, 2.6, -10.5, 0xa8c0ff, 0.8, 32);
    [22, 38, 54].forEach(function (z) { plight(0, LH - 3, z, 0xffd9a0, 0.5, 30); });
    plight(-(LX - 3.2), 3.4, 40, 0xffd7a0, 0.6, 22);

    /* ================= AUDITORIUM ================= */
    var wallH = 13.3, wallCy = 2.65, ceilY = 9.3, midZ = (FRONT_Z + 12.4) / 2;
    B(.3, wallH, 27.4, mWall, -12.15, wallCy, midZ); B(.3, wallH, 27.4, mWall, 12.15, wallCy, midZ);
    B(24.6, wallH, .3, M(0x262b3b), 0, wallCy, FRONT_Z - .15); B(24.6, .3, 27.4, mCeil, 0, ceilY + .15, midZ);
    FL(24, 6.3, 0, -11.85, FLOOR, mCarA, 2);
    B(24, .6, 3.5, mDark, 0, (FLOOR - 3.4) / 2, -13.25); FL(24, 3.5, 0, -13.25, -3.4 + .002, M(0x262d4a), 2);

      var t = vid.currentTime;
      if (capCues) {
        for (var i = 0; i < capCues.length; i++) { var c = capCues[i]; if (c.s > t) break; if (t < c.e) return c.t; }
        return '';
      }
      var tt = vid.textTracks;
      for (var k = 0; tt && k < tt.length; k++) {
        if (tt[k].mode === 'disabled') tt[k].mode = 'hidden';
        var ac = tt[k].activeCues;
        if (ac && ac.length) { var parts = []; for (var j = 0; j < ac.length; j++) parts.push(ac[j].text); return parts.join('\n').replace(/<[^>]+>/g, ''); }
      }
      return '';
    }
    function updateCaption() {
      var text = currentCaption();
      if (text !== capShown) { capShown = text; drawCap(text); }
      capPlane.isVisible = !!text;
    }
    window.addEventListener('keydown', function (e) {
      if ((e.key === 'c' || e.key === 'C') && panel.hidden && vpanel.hidden && tpanel.hidden) { var cb = $('capOn'); cb.checked = !cb.checked; capOn = cb.checked; }
    });
    $('capOn').addEventListener('change', function () { capOn = $('capOn').checked; });

    $('playVideo').addEventListener('click', function () {
      var f = vfile.files && vfile.files[0];
      if (!f) { verr.textContent = 'Choose a video file first.'; return; }
      if (f.type && f.type.indexOf('video') !== 0) { verr.textContent = 'That does not look like a video file.'; return; }
      stopVideo();
      if (!vid) {
        vid = document.createElement('video'); vid.setAttribute('playsinline', ''); vid.setAttribute('webkit-playsinline', ''); vid.playsInline = true; vid.preload = 'auto';
        ['play', 'pause', 'ended'].forEach(function (ev) { vid.addEventListener(ev, syncPause); });
        vid.addEventListener('playing', function () { syncPause(); if (vpending) { vpending = false; verr.textContent = ''; closeVpanel(); } });
        vid.style.cssText = 'position:fixed;right:0;bottom:0;width:160px;height:90px;opacity:.01;pointer-events:none;z-index:-1';
        vid.addEventListener('error', function () { if (!vurl) return; var code = vid.error ? vid.error.code : 0; stopVideo(); vpanel.hidden = false; verr.textContent = 'This browser could not play that file (error ' + code + '). MP4 with H.264 video and AAC audio works best.'; });
        document.body.appendChild(vid);
      }
      var cf = $('captionFile').files && $('captionFile').files[0]; capCues = null; capOn = $('capOn').checked;
      if (cf) { var fr = new FileReader(); fr.onload = function () { var cc = parseCues(String(fr.result)); capCues = cc.length ? cc : null; }; fr.readAsText(cf); }
      vurl = URL.createObjectURL(f); vid.src = vurl; vid.muted = false; vid.volume = 1; vpending = true; verr.textContent = 'Loading video...';
      var p = vid.play();
      if (p && p.catch) p.catch(function () { vpending = false; vpanel.hidden = false; verr.textContent = 'Playback was blocked by the browser. Press Play on screen again.'; });
      vtex = new BJ.DynamicTexture('vtex', { width: 960, height: 540 }, scene, false); vctx = vtex.getContext(); vLast = -1;
      vctx.fillStyle = '#000'; vctx.fillRect(0, 0, 960, 540); vtex.update();
      vtex.level = .85; screenMat.emissiveTexture = vtex;
      ytOn = false; yt.style.display = 'none'; yt.removeAttribute('src');
    });
    $('stopVideo').addEventListener('click', function () { stopVideo(); closeVpanel(); });
    function syncPause() { var on = !!(vid && vtex); pauseBtn.hidden = !on; pauseBtn.textContent = on && vid.paused ? '\u25B6 Play' : '\u275A\u275A Pause'; }
    function togglePause() { if (!vid || !vtex) return; if (vid.paused) { var p = vid.play(); if (p && p.catch) p.catch(function () {}); } else vid.pause(); }
    pauseBtn.addEventListener('click', togglePause);
    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space' && vid && vtex && panel.hidden && vpanel.hidden && tpanel.hidden) { e.preventDefault(); togglePause(); }
    });
    function updateVideoFrame() {
      if (!vid || !vtex || vid.readyState < 2) return;
      var t = vid.currentTime; if (t === vLast) return; vLast = t;
      var W = 960, H = 540, vw = vid.videoWidth || 16, vh = vid.videoHeight || 9, s = Math.min(W / vw, H / vh), dw = vw * s, dh = vh * s;
      vctx.fillStyle = '#000'; vctx.fillRect(0, 0, W, H);
      try { vctx.drawImage(vid, (W - dw) / 2, (H - dh) / 2, dw, dh); } catch (e) {}
      vtex.update();
    }
    $('closeVideo').addEventListener('click', closeVpanel);
    function ytId(v) {
      var raw = (v || '').trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(raw)) return raw;
      try {
        var u = new URL(raw), host = u.hostname.replace(/^www\./, '').toLowerCase(), id = '';
        if (host === 'youtu.be') id = u.pathname.split('/').filter(Boolean)[0] || '';
        else if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'youtube-nocookie.com') {
          id = u.searchParams.get('v') || '';
          if (!id) { var ps = u.pathname.split('/').filter(Boolean); if (ps.length > 1 && ['embed', 'shorts', 'live', 'v'].indexOf(ps[0]) !== -1) id = ps[1]; }
        }
        return /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : '';
      } catch (e) { return ''; }
    }
    $('playYoutube').addEventListener('click', function () {
      var id = ytId(urlIn.value);
      if (!id) { errEl.textContent = 'That link does not look like a valid YouTube video URL.'; return; }
      stopVideo(); yt.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&playsinline=1&rel=0'; ytOn = true; closePanel();
    });
    $('closeYoutube').addEventListener('click', closePanel);
    prompt.addEventListener('click', openNearby);
    urlIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') $('playYoutube').click(); if (e.key === 'Escape') closePanel(); });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !panel.hidden) closePanel();
      if (e.key === 'Escape' && !vpanel.hidden) closeVpanel();
      if (e.key === 'Escape' && !tpanel.hidden) closeTickets();
      if ((e.key === 'e' || e.key === 'E') && panel.hidden && vpanel.hidden && tpanel.hidden) { if (hover && !anim) sitAt(hover); else if (nearby && !anim) openNearby(); }
    });
    var CORN = [[-7.2, 6.65], [7.2, 6.65], [7.2, -1.45], [-7.2, -1.45]];
    function updateYT() {
      if (!ytOn) return;
      var cp = Math.cos(P.pitch), fx = -Math.sin(P.yaw) * cp, fy = Math.sin(P.pitch), fz = -Math.cos(P.yaw) * cp;
      var tx = -P.x, ty = 2.6 - P.y, tz = -14.54 - P.z, tl = Math.hypot(tx, ty, tz) || 1;
      if ((fx * tx + fy * ty + fz * tz) / tl < .35) { yt.style.display = 'none'; return; }
      var rw = engine.getRenderWidth(), rh = engine.getRenderHeight(), vp = cam.viewport.toGlobal(rw, rh), tm = scene.getTransformMatrix();
      var rect = stage.getBoundingClientRect(), pts = [];
      for (var q = 0; q < 4; q++) {
        var v = V3.Project(new V3(CORN[q][0], CORN[q][1], 14.52), BJ.Matrix.IdentityReadOnly, tm, vp);
        if (v.z < 0 || v.z > 1) { yt.style.display = 'none'; return; }
        pts.push({ x: v.x * rect.width / rw, y: v.y * rect.height / rh });
      }
      var xs = pts.map(function (p) { return p.x; }), ys = pts.map(function (p) { return p.y; });
      var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
      if (x1 < 0 || x0 > rect.width || y1 < 0 || y0 > rect.height || x1 - x0 < 8 || y1 - y0 < 8) { yt.style.display = 'none'; return; }
      var s = yt.style; s.display = 'block'; s.left = x0 + 'px'; s.top = y0 + 'px'; s.width = (x1 - x0) + 'px'; s.height = (y1 - y0) + 'px';
      var poly = 'polygon(' + pts.map(function (p) { return ((p.x - x0) / (x1 - x0) * 100) + '% ' + ((p.y - y0) / (y1 - y0) * 100) + '%'; }).join(',') + ')';
      s.clipPath = poly; s.webkitClipPath = poly;
    }

    /* ---------- input ---------- */
    var keys = {}, joy = { x: 0, y: 0 };
    var map = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd', ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', ShiftLeft: 'shift', ShiftRight: 'shift' };
    window.addEventListener('keydown', function (e) {
      if (!panel.hidden || !vpanel.hidden || !tpanel.hidden) return;
      var k = map[e.code]; if (!k) return;
      if (e.code.indexOf('Arrow') === 0) e.preventDefault();
      keys[k] = true;
    });
    window.addEventListener('keyup', function (e) { var k = map[e.code]; if (k) keys[k] = false; });
    window.addEventListener('blur', function () { keys = {}; joy.x = 0; joy.y = 0; });
    var drag = null;
    stage.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY }; try { stage.focus({ preventScroll: true }); stage.setPointerCapture(e.pointerId); } catch (x) {} });
    stage.addEventListener('pointermove', function (e) {
      if (!drag) return;
      P.yaw -= (e.clientX - drag.x) * .0045; P.pitch = Math.max(-1.1, Math.min(1.1, P.pitch - (e.clientY - drag.y) * .0045));
      drag.x = e.clientX; drag.y = e.clientY;
    });
    function endDrag() { drag = null; }
    stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);

    var stick = $('stick'), knob = $('knob'), sid = null, SR = 42;
    if (coarse) stick.hidden = false;
    function stickMove(e) {
      var b = stick.getBoundingClientRect(), dx = e.clientX - (b.left + b.width / 2), dy = e.clientY - (b.top + b.height / 2), len = Math.hypot(dx, dy);
      if (len > SR) { dx = dx / len * SR; dy = dy / len * SR; }
      joy.x = dx / SR; joy.y = dy / SR; knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    }
    stick.addEventListener('pointerdown', function (e) { sid = e.pointerId; try { stick.setPointerCapture(sid); } catch (x) {} stickMove(e); });
    stick.addEventListener('pointermove', function (e) { if (e.pointerId === sid) stickMove(e); });
    function stickEnd(e) { if (e.pointerId !== sid) return; sid = null; joy.x = 0; joy.y = 0; knob.style.transform = 'translate(0,0)'; }
    stick.addEventListener('pointerup', stickEnd); stick.addEventListener('pointercancel', stickEnd);

    function resize() {
      engine.resize();
      var w = stage.clientWidth || window.innerWidth, h = stage.clientHeight || window.innerHeight;
      cam.fov = (w / h < 1 ? 78 : 62) * Math.PI / 180;
    }
    if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });
    resize();

    spots.seats(); mark('seats');
    var last = performance.now();
    engine.runRenderLoop(function () {
      var now = performance.now(), dt = Math.min(.05, (now - last) / 1000); last = now;
      var f = (keys.w || keys.up ? 1 : 0) - (keys.s || keys.down ? 1 : 0) - joy.y;
      var s = (keys.d ? 1 : 0) - (keys.a ? 1 : 0) + joy.x;
      var turn = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
      if (turn && !anim) P.yaw += turn * 1.8 * dt;
      if (!anim && (Math.abs(f) > .05 || Math.abs(s) > .05)) {
        if (seat) { stand(P.x, seat.z - .625, P.yaw, Math.min(P.pitch, .3)); mark(''); }
        var len = Math.hypot(f, s); if (len > 1) { f /= len; s /= len; }
        var sp = (keys.shift || Math.hypot(joy.x, joy.y) > .92 ? 5.6 : 3.2) * dt, sy = Math.sin(P.yaw), cy = Math.cos(P.yaw);
        P.x += (-sy * f + cy * s) * sp; P.z += (-cy * f - sy * s) * sp; resolve(P);
      }
      nearby = seat ? null : Math.hypot(P.x - (vmX - 1.2), P.z - vmZ) < 2.6 ? 'yt' : Math.hypot(P.x - vkX, P.z - (vkZ - 1.3)) < 2.4 ? 'vid' : nearTix() ? 'tix' : null;
      prompt.textContent = nearby === 'vid' ? 'Use the video kiosk (E)' : nearby === 'tix' ? 'Get tickets (E)' : 'Use the YouTube machine (E)';
      prompt.hidden = !nearby || !panel.hidden || !vpanel.hidden || !tpanel.hidden || !!anim;
      var targetY = seat ? seat.y + SEATED_EYE : groundY(P.z) + EYE;
      if (!anim) P.y = Math.abs(targetY - P.y) > .002 ? P.y + (targetY - P.y) * Math.min(1, dt * 12) : targetY;
      stepAnim(dt); updateHover(); updateCaption(); updateVideoFrame(); updateAlive(now / 1000);
      var cp = Math.cos(P.pitch);
      cam.position.set(P.x, P.y, -P.z);
      cam.setTarget(new V3(P.x - Math.sin(P.yaw) * cp, P.y + Math.sin(P.pitch), -P.z + Math.cos(P.yaw) * cp));
      scene.render();
      updateYT();
    });

    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('40px Limelight'), document.fonts.load('500 24px "DM Sans"'), document.fonts.load('700 24px "DM Sans"')])
        .then(function () { reg.forEach(function (r) { r(); }); }).catch(function () {});
    }
  }
})();
